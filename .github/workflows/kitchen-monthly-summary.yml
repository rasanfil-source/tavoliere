name: Kitchen monthly totals

on:
  schedule:
    - cron: '5 19,20,21,22,23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitchen-monthly-summary
  cancel-in-progress: false

jobs:
  calculate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud with keyless OIDC
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Record closed kitchen days and clean expired aggregates
        run: node tools/kitchen-monthly-summary.mjs
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
